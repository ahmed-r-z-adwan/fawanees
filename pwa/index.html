<style>
:root {
  --night: #15112a; --night-2: #1d1838; --tile: #231d40; --line: #3a3363;
  --text: #ece7f7; --muted: #a39cc4; --amber: #f2b447; --amber-core: #ffe9b8; --turq: #3cc8cf; --turq-core: #c8f7f8;
  --radius: 14px;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; background: radial-gradient(120% 90% at 50% 20%, #251d49 0%, var(--night) 55%, #0f0c1f 100%) fixed; background-color: var(--night); color: var(--text); }
body { font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; font-size: 16px; line-height: 1.5; min-height: 100vh; }
button { font: inherit; color: inherit; }
.app { max-width: 1120px; margin: 0 auto; padding: 14px 16px 24px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: "Reem Kufi", "IBM Plex Sans Arabic", sans-serif; font-weight: 700; font-size: 34px; line-height: 1.1; margin: 0; color: #f6ead0; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { background: transparent; border: 1px solid #4b4480; border-radius: 999px; padding: 8px 14px; cursor: pointer; min-height: 40px; }
.btn:hover { border-color: #6d64ad; }
.btn:focus-visible, canvas:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.btn.primary { background: var(--amber); color: #1a1531; border-color: var(--amber); font-weight: 700; }
.btn[disabled] { opacity: .4; cursor: default; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; margin-top: 14px; align-items: start; }
.board-wrap { position: relative; }
canvas#board { width: 100%; aspect-ratio: 17 / 19.4; display: block; touch-action: manipulation; border-radius: var(--radius); }
.toast { position: absolute; inset-inline: 0; bottom: 8px; margin: 0 auto; width: max-content; max-width: 90%; background: #2b2350; border: 1px solid var(--amber); color: #ffe2a0; padding: 6px 14px; border-radius: 999px; font-weight: 700; opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
.panel { display: flex; flex-direction: column; gap: 14px; }
.card { background: rgba(35, 29, 64, .72); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.side { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 4px 0; }
.side .name { font-weight: 500; }
.side .sub { color: var(--muted); font-size: 13px; }
.side .pts { font-family: "Reem Kufi", sans-serif; font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.side.p1 .pts { color: var(--amber); } .side.p2 .pts { color: var(--turq); }
.side.turn .name::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-inline-start: 8px; vertical-align: middle; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.meter { margin-top: 10px; }
.meter .bar { height: 10px; border-radius: 999px; background: var(--turq); overflow: hidden; display: flex; }
.meter .fill { height: 100%; background: var(--amber); transition: width .6s ease; }
.meter .legend { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 4px; }
.meter.unknown .bar { opacity: .3; }
.status { font-weight: 700; font-size: 17px; }
.mind p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.mind .pred { color: #ffe2a0; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.controls .btn { flex: 1 1 auto; }
.toggles { display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-size: 14px; }
.toggles[hidden] { display: none; }   /* the attribute alone loses to the display above */
.toggles label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
/* Offered once, only when the browser says the page can actually be installed. */
.install { position: fixed; inset-inline: 10px; z-index: 50; display: none;
  /* fixed position ignores the padding on :root, so clear the home indicator here */
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  align-items: center; gap: 10px; background: #2b2350; border: 1px solid var(--amber);
  border-radius: var(--radius); padding: 10px 12px; box-shadow: 0 8px 28px rgba(0,0,0,.45);
  max-width: 560px; margin: 0 auto; }
.install.show { display: flex; }
.install .txt { flex: 1 1 auto; font-size: 14px; color: #ffe2a0; }
.install .btn { flex: 0 0 auto; }
.install .x { background: none; border: 0; color: var(--muted); font-size: 20px; line-height: 1;
  cursor: pointer; padding: 2px 6px; }
.linkbar { display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
.linkbar .linkturn { font-weight: 700; }
.linkbar .linkrow { display: flex; gap: 8px; }
.linkbar .linkrow .btn { flex: 1 1 auto; }
#btnShare { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
#btnShare svg { flex: 0 0 auto; }
/* The waiting room. Your friend is either here or not, so the whole state is a dot and a line. */
.peer { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.peer .dot { flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; background: #5a5382; }
.peer.here .dot { background: #4ad07a; box-shadow: 0 0 0 4px rgba(74, 208, 122, .16); }
.peer.here { color: #b7f0cb; }
.peer.waiting .dot { background: var(--amber); animation: peerPulse 1.4s ease-in-out infinite; }
.peer.waiting { color: #ffe2a0; }
.peer.gone .dot { background: #e06a6a; }
.peer.gone { color: #ffbdbd; }
@keyframes peerPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .3; transform: scale(.75); } }
@media (prefers-reduced-motion: reduce) { .peer.waiting .dot { animation: none; } }
.roomcode { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .16em;
  font-size: 20px; font-weight: 700; color: #f6ead0; direction: ltr; unicode-bidi: isolate; text-align: center;
  background: #1a1536; border: 1px dashed #4b4480; border-radius: 10px; padding: 6px 4px; }
footer { margin-top: 18px; color: #7e77a3; font-size: 13px; text-align: center; }
footer a { color: var(--muted); }
dialog { background: #1e1938; color: var(--text); border: 1px solid var(--line); border-radius: 18px; padding: 20px; max-width: min(560px, 92vw); max-height: 86vh; overflow: auto; }
dialog::backdrop { background: rgba(8, 6, 18, .7); }
dialog h2 { font-family: "Reem Kufi", sans-serif; margin: 0 0 10px; font-size: 26px; color: #f6ead0; }
dialog ol { padding-inline-start: 22px; margin: 8px 0; }
dialog li { margin: 6px 0; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
.seg button { border: 1px solid #4b4480; background: transparent; border-radius: 999px; padding: 7px 12px; cursor: pointer; min-height: 38px; }
.seg button[aria-pressed="true"] { background: #3a3170; border-color: var(--amber); }
.field-label { color: var(--muted); font-size: 14px; }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.stats { color: var(--muted); font-size: 14px; }
dialog.learn { max-width: min(880px, 94vw); width: min(880px, 94vw); }
.learn-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.learn-head h2 { margin: 2px 0 0; }
.learn-step { color: var(--muted); font-size: 13px; }
.learn-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 12px; align-items: start; }
.learn-boardwrap { background: rgba(21, 17, 42, .5); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; }
canvas#learnBoard, canvas#puzzleBoard { width: 100%; aspect-ratio: 11 / 12; display: block; touch-action: manipulation; cursor: pointer; }
.learn-side { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.learn-text p { margin: 0 0 10px; }
.learn-text .learn-task { color: #ffe2a0; font-weight: 700; }
.learn-text .learn-result { color: var(--text); border-inline-start: 3px solid var(--amber); padding-inline-start: 10px; }
.learn-hint { color: var(--muted); font-size: 13px; min-height: 3em; }  /* two lines: the wrong-cell message wraps, and a centred dialog that grows moves the board */
/* Space is reserved so feedback appearing cannot resize the dialog: a centred <dialog> that
   grows slides the board out from under the player's finger mid-tap. */
.learn-note { color: #ffe2a0; font-size: 14px; min-height: 3.2em; margin-bottom: 4px; }
@media (max-width: 720px) { .learn-grid { grid-template-columns: 1fr; } dialog.learn { padding: 14px; } }
@media (max-width: 460px) {
  /* five buttons and a strapline do not both fit on a phone; the buttons win. */
  .brand p { display: none; }
  .brand h1 { font-size: 26px; }
  .top-actions .btn { padding: 6px 10px; font-size: 13px; }
}
@media (max-width: 860px) {
  main { grid-template-columns: 1fr; }
  .brand h1 { font-size: 28px; }
  .brand p { font-size: 13px; }
  .top-actions { gap: 6px; }
  .top-actions .btn { padding: 6px 11px; min-height: 36px; font-size: 14px; }
  .app { padding: 10px 10px 20px; }
}
@media (prefers-reduced-motion: reduce) { .toast, .meter .fill { transition: none; } .side.turn .name::after { animation: none; } }
</style>
</head>

<div class="app">
  <header>
    <div class="brand"><h1 data-i18n="title">فوانيس</h1><p data-i18n="tagline">لعبة ضوء وظل اخترعها ذكاء اصطناعي</p></div>

      <button class="btn" id="btnRules" data-i18n="rules">القواعد</button>

      <button class="btn" id="btnLang" aria-label="Language">EN</button>
    </div>
  </header>
  <main>
    <section class="board-wrap">
      <canvas id="board" tabindex="0" role="application" aria-label="لوح اللعبة"></canvas>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
    <aside class="panel">

        <div class="side p2" id="side2"><canvas class="icon" width="68" height="68" style="width:34px;height:34px"></canvas><div><div class="name" id="name2"></div><div class="sub" id="hand2"></div></div><div class="pts" id="pts2">0</div></div>
        <div class="meter"><div class="bar"><div class="fill" id="meterFill" style="width:50%"></div></div><div class="legend"><span id="meter1"></span><span id="meter2"></span></div></div>
      </div>
      <div class="card">
        <div class="status" id="status" aria-live="polite"></div>

      </div>

      <div class="card linkbar" id="linkBar" hidden>

        <div class="linkrow">
          <button class="btn primary" id="btnShare"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3"/><path d="M7.5 7.5 12 3l4.5 4.5"/><path d="M4 13v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/></svg><span id="btnShareText"></span></button>

        <label><input type="checkbox" id="optPredict" checked> <span data-i18n="predict">دع الآلة تتوقع حركتي</span></label>
      </div>

  <footer><span data-i18n="credit">صمّم القواعد ووازنها وبرمج الذكاء الاصطناعي: Claude من Anthropic. الفكرة والنشر: أحمد عدوان.</span> <a href="#" id="linkHow" data-i18n="how">كيف صُنعت؟</a></footer>
  <div class="install" id="installBar" role="region">
    <span class="txt" id="installText"></span>
    <button class="btn primary" id="installGo"></button>
    <button class="x" id="installNo" aria-label="close">&times;</button>
  </div>
</div>

<dialog id="dlgNew">
  <h2 data-i18n="newGame">لعبة جديدة</h2>

</dialog>

<!-- The engine runs here AND is read back as text to build the worker, so it is inlined once. -->
<script>
// Two devices, no backend.
//
// The page is a static file with nowhere to put a server, so for a game across two phones it
// borrows a public MQTT broker as a post box: both devices connect to the same broker over a
// secure WebSocket, subscribe to one room, and publish to it. The broker sees a random room id
// and a list of move numbers, nothing else.
//
// MQTT is used rather than WebRTC because it always connects. A peer-to-peer link is nicer in
// principle, but mobile carriers put phones behind NAT that a direct connection cannot cross
// without a relay of its own, so "it works on my wifi" turns into "it fails on my friend's data".
// A broker relays, so there is nothing to negotiate.
//
// Presence falls out of the protocol for free, which is the reason for the whole choice:
//
//   * A "last will and testament" is a message the broker publishes on your behalf when your
//     connection dies. Set it to "I am gone" and the other player finds out whether you closed
//     the tab, locked the phone, or walked out of signal.
//   * A "retained" message is kept by the broker and handed to whoever subscribes next, so the
//     player who arrives second is given the position immediately instead of waiting for a move.
//
// It is written by hand instead of pulling in a library because the published page stays one

// ---------------- AI scheduling ----------------
// The search must never block the page. First choice is a Web Worker built from a Blob of the
// inlined engine, so the search runs on another thread entirely. If the worker cannot start --
// which is what happens when the single file is opened straight from disk in Chrome, because a
// blob: worker inherits an opaque file:// origin -- we fall back to running the same search on
// the main thread in short slices, yielding between them. Either way every completed depth is
// streamed back, so the board can show the machine thinking.
const AI = (function () {
  const SLICE_MS = 10;          // longest main-thread block the fallback allows itself
  const WORKER_HANDSHAKE_MS = 2500;
  let worker = null, ready = null, mode = 'pending', seq = 0;
  let localEngine = null, localGeoKey = '';

  // A macrotask that is not clamped to 4ms the way nested setTimeout(0) is.
  const chan = typeof MessageChannel !== 'undefined' ? new MessageChannel() : null;
  const yieldQueue = [];
  if (chan) chan.port1.onmessage = () => { const f = yieldQueue.shift(); if (f) f(); };
  const soon = chan ? (f) => { yieldQueue.push(f); chan.port2.postMessage(0); } : (f) => setTimeout(f, 0);

  function workerSource() {
    return document.getElementById('engineCode').textContent + '\n;\n' + document.getElementById('workerCode').textContent;
  }
  function failWorker(why) {
    if (mode === 'local') return;
    mode = 'local';
    lastFallbackReason = why;
    if (worker) { try { worker.terminate(); } catch (e) {} worker = null; }
    // Anything still out there has to be redone locally.
    for (const [, job] of inflight) if (!job.cancelled) job.restart();

  let lastFallbackReason = '';

  function boot() {
    if (ready) return ready;
    ready = new Promise(resolve => {
      if (typeof Worker === 'undefined' || typeof Blob === 'undefined' || typeof URL === 'undefined' || !URL.createObjectURL) {
        failWorker('no Worker support'); return resolve('local');
      }
      let url = null;
      try {
        url = URL.createObjectURL(new Blob([workerSource()], { type: 'text/javascript' }));
        worker = new Worker(url);
      } catch (e) {
        if (url) URL.revokeObjectURL(url);
        failWorker('Worker constructor threw: ' + e); return resolve('local');
      }
      const timer = setTimeout(() => { failWorker('worker did not answer in ' + WORKER_HANDSHAKE_MS + 'ms'); resolve('local'); }, WORKER_HANDSHAKE_MS);
      worker.onerror = (e) => { clearTimeout(timer); if (e && e.preventDefault) e.preventDefault(); failWorker('worker error: ' + ((e && e.message) || 'blocked')); resolve('local'); };
      worker.onmessage = (ev) => {
        const m = ev.data;
        if (m.type === 'ready') { clearTimeout(timer); URL.revokeObjectURL(url); mode = 'worker'; return resolve('worker'); }
        const job = inflight.get(m.id);
        if (!job) return;
        if (m.type === 'depth') { if (!job.cancelled) job.onDepth && job.onDepth(m); return; }
        inflight.delete(m.id);
        if (m.type === 'fail') { if (!job.cancelled) job.restart(); return; }
        job.resolve(m);
      };
      worker.postMessage({ type: 'ping' });
    });
    return ready;
  }

  function localRun(board, side, opts, onDepth, isStale) {
    const key = RADIUS + '|' + JSON.stringify(RULES);
    if (!localEngine || localGeoKey !== key) { localEngine = new F.Engine(geo, RULES, { mob: 0 }); localGeoKey = key; }
    return new Promise(resolve => {
      const run = localEngine.startSearch(board, side, opts);
      const budget = opts.timeMs ?? 1000;
      const deadline = Date.now() + budget;
      const tick = () => {
        if (isStale()) return resolve(run.result());
        if (run.finished || Date.now() > deadline) return resolve(run.result());
        // Same time management as the worker, and off by default for the same measured reason.
        if (opts.earlyExit === true && run.shouldStopEarly(budget, opts.branchFactor)) return resolve(run.result());
        const advanced = run.step(Math.min(deadline, Date.now() + SLICE_MS));
        if (advanced && onDepth) onDepth(run.snapshot());
        if (run.finished || Date.now() >= deadline) return resolve(run.result());
        soon(tick);
      };
      soon(tick);
    });
  }

  return {
    // Kick the worker off early so the first move does not pay the startup cost.
    warmup() { boot(); },
    // Used by the tests to exercise the fallback path on a browser where workers do start.
    forceLocal() { failWorker('forced by test'); ready = Promise.resolve('local'); },
    get mode() { return mode; },
    get fallbackReason() { return lastFallbackReason; },
    // Returns {promise, cancel}. cancel() stops the callbacks; the promise still settles.
    think(board, side, opts, onDepth) {

        if (cancelled) return { move: -1, value: 0, depth: 0, nodes: 0, ms: 0, pv: [], scores: [], side, cancelled: true };

              resolve,
              get cancelled() { return cancelled; },

            };

            const buf = snapshot.slice().buffer;

        return localRun(snapshot, side, opts, (m) => { if (!cancelled) onDepth && onDepth(m); }, () => cancelled);
      });
      return { promise, cancel() { cancelled = true; } };
    },
  };
})();

// Tiles shaded by who lights them, and the beams themselves. Shared by the game board and the
// tutorial board so a lantern looks and behaves the same in both.
function paintTiles(c, g, pos, size, board, light) {
  for (let i = 0; i < g.N; i++) {
    const [x, y] = pos(i);
    hexPath(c, x, y, size * 0.95); c.fillStyle = '#1f1a3a'; c.fill();

      else if (a > 0) { c.fillStyle = 'rgba(214,205,245,0.09)'; c.fill(); }

function paintBeams(c, g, pos, size, board) {

  // board state to show (animation may override)
  const board = anim ? anim.board : game.board;
  const sc = F.makeScratch(geo.N); geo.range = RULES.range; F.computeLight(geo, board, sc);
  // preview (selected cell)
  let prev = null;
  if (selected >= 0 && !anim && board[selected] === 0) {
    const b2 = board.slice(); const sc2 = F.makeScratch(geo.N);
    const waves = F.applyMove(geo, b2, game.toMove, selected, RULES, sc2, true);
    F.computeLight(geo, b2, sc2);
    prev = { board: b2, sc: sc2, flips: new Set([].concat(...waves)) };
  }
  const L = prev ? prev.sc : sc, B = prev ? prev.board : board;
  paintTiles(ctx, geo, px, size, B, L);
  paintBeams(ctx, geo, px, size, B);
  // ---- the machine's thinking, drawn live ----
  const showThoughts = document.getElementById('optThoughts').checked;
  if (showThoughts && !prev && live && live.scores && live.scores.length) {
    // candidate cells glowing by how good the search currently rates them
    const col = COLORS[live.side].rgb;
    const cands = live.scores.filter(s => s.move >= 0 && board[s.move] === 0);
    const best = cands.length ? cands[0].score : 0, SPAN = 12; // points below the best still worth showing
    for (let k = 0; k < cands.length && k < 16; k++) {
      const rel = (cands[k].score - (best - SPAN)) / SPAN;
      if (!(rel > 0)) continue;
      const [x, y] = px(cands[k].move);
      hexPath(ctx, x, y, size * 0.9);
      ctx.fillStyle = `rgba(${col},${(0.05 + 0.34 * rel * rel).toFixed(3)})`;
      ctx.fill();
    }
  }
  // principal variation as numbered ghost lanterns: live while it thinks, then the line it expects
  if (showThoughts && !prev) {
    const ghosts = (live && live.pv && live.pv.length) ? live.pv.slice(0, 5) : plan;
    (ghosts || []).forEach((pm, k) => {
      if (pm.move < 0 || board[pm.move]) return;
      const [x, y] = px(pm.move), c = COLORS[pm.player];
      drawLantern(ctx, x, y, size * 0.78, pm.player, 0.28, 0.7);
      ctx.save();
      ctx.setLineDash([size * 0.18, size * 0.14]);
      ctx.strokeStyle = `rgba(${c.rgb},0.8)`; ctx.lineWidth = Math.max(1, size * 0.06);
      ctx.beginPath(); ctx.arc(x, y, size * 0.74, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      const r = Math.max(7, size * 0.29), bx = x + size * 0.58, by = y - size * 0.58;
      ctx.fillStyle = c.glow; ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#15112a'; ctx.font = `700 ${Math.round(r * 1.3)}px "IBM Plex Sans Arabic", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(k + 1), bx, by);
    });
  }
  // lanterns
  const tNow = performance.now();
  for (let i = 0; i < geo.N; i++) {
    const p = B[i]; if (!p) continue;
    const [x, y] = px(i);
    if (anim && anim.flipAt && anim.flipAt[i] !== undefined) {
      const prog = Math.min(1, Math.max(0, (tNow - anim.flipAt[i]) / 380));
      if (prog > 0 && prog < 1) { ctx.strokeStyle = `rgba(${COLORS[p].rgb},${1 - prog})`; ctx.lineWidth = size * 0.1; ctx.beginPath(); ctx.arc(x, y, size * (0.5 + prog * 0.9), 0, Math.PI * 2); ctx.stroke(); }
    }
    const isNew = anim && anim.placed === i;
    const sc0 = isNew ? Math.min(1, Math.max(0, (tNow - anim.t0) / 260)) : 1;
    drawLantern(ctx, x, y, size * 0.95 * (0.6 + 0.4 * sc0), p, prev && i === selected ? 0.75 : 1, isNew ? 1.6 - 0.6 * sc0 : 1);
    if (prev && prev.flips.has(i)) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1.5, size * 0.08); ctx.beginPath(); ctx.arc(x, y, size * 0.72, 0, Math.PI * 2); ctx.stroke(); }
  }
  // last move marker
  const lastRec = game.history[game.history.length - 1];
  if (!prev && lastRec && lastRec.move >= 0 && !anim) {
    const [x, y] = px(lastRec.move); ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = Math.max(1, size * 0.05);
    hexPath(ctx, x, y, size * 0.86); ctx.stroke();
  }
  // prediction reveal
  if (revealCell >= 0) {
    const [x, y] = px(revealCell); ctx.strokeStyle = '#ffe2a0'; ctx.lineWidth = Math.max(2, size * 0.1); ctx.setLineDash([size * 0.15, size * 0.1]);
    hexPath(ctx, x, y, size * 0.8); ctx.stroke(); ctx.setLineDash([]);
  }
  // selection / keyboard cursor
  if (selected >= 0) { const [x, y] = px(selected); ctx.strokeStyle = COLORS[game.toMove].glow; ctx.lineWidth = Math.max(2, size * 0.1); hexPath(ctx, x, y, size * 0.9); ctx.stroke(); }
  else if (document.activeElement === canvas && cursor >= 0) { const [x, y] = px(cursor); ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; hexPath(ctx, x, y, size * 0.9); ctx.stroke(); }
}

function drawIcons() {
  document.querySelectorAll('.side').forEach((el, k) => {
    const c = el.querySelector('canvas.icon'); const cx2 = c.getContext('2d');
    cx2.clearRect(0, 0, 68, 68);
    const p = k + 1, col = COLORS[p];
    cx2.save(); const g = cx2.createRadialGradient(34, 34, 0, 34, 34, 32); g.addColorStop(0, `rgba(${col.rgb},0.5)`); g.addColorStop(1, `rgba(${col.rgb},0)`);
    cx2.fillStyle = g; cx2.beginPath(); cx2.arc(34, 34, 32, 0, 7); cx2.fill();
    cx2.fillStyle = col.core; cx2.strokeStyle = col.glow; cx2.lineWidth = 3;
    cx2.beginPath(); cx2.moveTo(22, 20); cx2.lineTo(46, 20); cx2.lineTo(50, 34); cx2.lineTo(46, 50); cx2.lineTo(22, 50); cx2.lineTo(18, 34); cx2.closePath(); cx2.fill(); cx2.stroke();
    cx2.fillStyle = col.glow; cx2.beginPath(); cx2.moveTo(34, 8); cx2.lineTo(41, 17); cx2.lineTo(27, 17); cx2.closePath(); cx2.fill(); cx2.fillRect(20, 50, 28, 5);
    cx2.restore();

}

// ---------------- panel ----------------
function fmtNum(n) {
  if (lang === 'ar') { if (n >= 1e6) return (n / 1e6).toFixed(1) + ' ' + t('mega'); if (n >= 1e4) return Math.round(n / 1e3) + ' ' + t('k'); return String(n); }
  if (n >= 1e6) return (n / 1e6).toFixed(1) + t('mega'); if (n >= 1e4) return Math.round(n / 1e3) + t('k'); return String(n);
}
// How far through the game we are, by lanterns placed. The win-chance model is fitted per phase
// because the same lead means very different things on move 3 and on move 40.
const SUPPLY_TOTAL = RULES.supply * 2;
function phaseNow() { return (SUPPLY_TOTAL - game.hands[1] - game.hands[2]) / SUPPLY_TOTAL; }

// Returns null when nothing has evaluated this position yet: the meter shows a dash rather than
// inventing a number.
function winProb1() {
  if (!evalInfo) return null;
  const v1 = evalInfo.side === 1 ? evalInfo.value : -evalInfo.value;
  if (Math.abs(v1) >= F.WIN - 500) return v1 > 0 ? 0.995 : 0.005;
  return CALIB.prob(v1, evalInfo.phase, evalInfo.side === 1);
}
// Every search in the page feeds the meter, including the one that guesses the human's move,
// so the bar keeps up instead of freezing until the machine's next turn.
function noteEval(res) {
  if (!res) return;
  evalInfo = { value: res.value, side: res.side, phase: phaseNow(), depth: res.depth };
}
function updatePanel(extra) {
  if (!game) return;
  const [a, b] = game.score();
  document.getElementById('pts1').textContent = a; document.getElementById('pts2').textContent = b;
  document.getElementById('name1').textContent = `${nameOf(1)} (${t('gold')})`.replace(`${t('gold')} (${t('gold')})`, t('gold'));
  document.getElementById('name2').textContent = `${nameOf(2)} (${t('turq')})`.replace(`${t('turq')} (${t('turq')})`, t('turq'));
  document.getElementById('hand1').textContent = t('left', game.hands[1]); document.getElementById('hand2').textContent = t('left', game.hands[2]);
  document.getElementById('side1').classList.toggle('turn', !game.over && game.toMove === 1);
  document.getElementById('side2').classList.toggle('turn', !game.over && game.toMove === 2);
  const p1 = winProb1();
  document.getElementById('meterFill').style.width = ((p1 === null ? 0.5 : p1) * 100).toFixed(1) + '%';
  document.getElementById('meter1').textContent = p1 === null ? t('chanceUnknown', t('gold')) : t('chance', t('gold'), Math.round(p1 * 100));
  document.getElementById('meter2').textContent = p1 === null ? t('chanceUnknown', t('turq')) : t('chance', t('turq'), 100 - Math.round(p1 * 100));
  document.querySelector('.meter').classList.toggle('unknown', p1 === null);
  let status;
  if (game.over) status = t('over');
  else if (Online.active() && !Online.peerHere) status = t(Online.everHere ? 'roomGone' : 'roomWaiting');
  else if (busy && !isHuman(game.toMove)) status = t('thinking');
  else if (isHuman(game.toMove)) status = cfg.mode === 'pvp' ? t('turnOf', t(game.toMove === 1 ? 'gold' : 'turq')) : t('yourTurn');
  else status = t('turnOf', nameOf(game.toMove));
  document.getElementById('status').textContent = status;
  const mind = document.getElementById('mind'); mind.innerHTML = '';
  const add = (txt, cls) => { const p = document.createElement('p'); p.textContent = txt; if (cls) p.className = cls; mind.appendChild(p); };
  if (live && busy && cfg.mode !== 'pvp') {
    add(t('searching', live.depth, fmtNum(live.nodes)));
  } else if (lastInfo && cfg.mode !== 'pvp') {
    add(t('depthLine', lastInfo.depth, fmtNum(lastInfo.nodes), fmtNum(Math.round(lastInfo.nodes / Math.max(0.001, lastInfo.ms / 1000)))));
    if (Math.abs(lastInfo.value) >= F.WIN - 500) add(t('forced'));
    else if (plan.length && document.getElementById('optThoughts').checked) add(t('planLine'));
  }
  if (predStats.total > 0 && cfg.mode === 'ai') add(t('predScore', predStats.hit, predStats.total), 'pred');
  if (extra) add(extra, 'pred');
  const bar = document.getElementById('linkBar');
  if (Online.active()) {
    Online.sync(game);                            // publishes only when the position actually moved
    Online.render();
  } else if (LinkGame.active()) {
    LinkGame.writeHash(game);
    bar.hidden = false;
    document.getElementById('peerRow').hidden = true;
    document.getElementById('roomCode').hidden = true;
    document.getElementById('btnRematch').hidden = true;
    document.getElementById('btnLeave').hidden = true;
    document.getElementById('btnShare').disabled = false;
    document.getElementById('linkTurn').hidden = false;
    document.getElementById('linkTurn').textContent = game.over
      ? t('over') : t('shareTurn', t(game.toMove === 1 ? 'gold' : 'turq'));
    document.getElementById('btnShareText').textContent = t('shareBtn');
  } else {
    bar.hidden = true;
  }

  document.getElementById('toggles').hidden = cfg.mode !== 'ai' && cfg.mode !== 'demo';
  const human = isHuman(game.toMove) && !game.over && !busy;
  document.getElementById('btnPass').disabled = !human;
  document.getElementById('btnHint').disabled = !human;
  document.getElementById('btnUndo').disabled = busy || game.history.length === 0 || cfg.mode === 'demo'
    || Online.active();                           // taking a move back under someone else is not a move
  const canSwap = human && !swapUsed && game.canSwap();
  document.getElementById('btnSwap').hidden = !canSwap;
}
let toastTimer = null;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200); }

// ---------------- moves & animation ----------------
function playMove(j, after) {
  const p = game.toMove;
  const rec = game.play(j);
  if (!rec) { busy = false; updatePanel(); draw(); return after && after(null); }
  // Send it the moment it is legal. Waiting for the animation to finish would tie the other
  // device to this one's frame loop, and a backgrounded tab is given no frames at all.
  Online.sync(game);
  if (j === -1) { toast(t('passed', cfg.mode === 'ai' ? nameOf(p) : t(p === 1 ? 'gold' : 'turq'))); updatePanel(); draw(); return after && after(rec); }
  if (game.history.length === 1) openingCell = j;
  const flipsTotal = rec.waves.reduce((s, w) => s + w.length, 0);
  biggestChain = Math.max(biggestChain, flipsTotal);
  const board0 = rec.before.slice(); board0[j] = p;
  const t0 = performance.now(); const flipAt = {};
  const waveDelay = reduceMotion ? 0 : 420;
  rec.waves.forEach((w, k) => w.forEach(i => { flipAt[i] = t0 + 300 + k * waveDelay; }));
  anim = { board: board0, placed: j, t0, flipAt };
  const total = reduceMotion ? 0 : 300 + rec.waves.length * waveDelay + 250;
  if (flipsTotal >= 2) setTimeout(() => toast(t('chain', flipsTotal)), reduceMotion ? 0 : 300);
  // If a newer animation or a new game has started, this loop is stale: stop, and do not touch
  // `anim` or call `after`, or two chains end up driving the same game.
  const token = ++animToken, gen = generation;
  const step = () => {
    if (token !== animToken || gen !== generation) return;
    const now = performance.now();
    rec.waves.forEach((w, k) => { if (now >= t0 + 300 + k * waveDelay) w.forEach(i => { anim.board[i] = p; }); });
    draw();
    if (now - t0 < total) requestAnimationFrame(step);
    else { anim = null; draw(); updatePanel(); after && after(rec); }
  };
  requestAnimationFrame(step);
}

function nextTurn() {
  updatePanel(); draw();
  if (game.over) return showOver();
  const p = game.toMove;
  // In a room the other colour belongs to a person somewhere else: wait for their move to arrive.
  if (Online.active() && !isHuman(p)) { busy = false; updatePanel(); draw(); return; }
  if (!game.canPlace(p) && !isHuman(p)) { return playMove(-1, () => setTimeout(nextTurn, 350)); }
  if (isHuman(p)) {
    busy = false; updatePanel();
    if (!swapUsed && game.canSwap()) toast(t('swapOffer'));
    if (cfg.mode === 'ai' && document.getElementById('optPredict').checked) setTimeout(makePrediction, 60);
    else setTimeout(meterEval, 60);
    return;
  }
  busy = true; updatePanel(); draw();
  setTimeout(() => machineMove(p), 60);
}

// Every search in the page goes through here, so none of them can block the UI.
// `onDepth` is called once per completed search depth; stale results are dropped.
function think(p, ms, depth, onDepth) {
  const gen = generation;
  const h = AI.think(game.board, p, { timeMs: ms, maxDepth: depth, prevPass: game.lastPass, hands: game.hands },
    (m) => { if (gen === generation && onDepth) onDepth(m); });
  return { cancel: h.cancel, promise: h.promise.then(res => (gen === generation && res && !res.cancelled) ? res : null) };
}


function machineMove(p) {
  const lv = LEVELS[cfg.mode === 'demo' ? 2 : cfg.level];
  // Opening: the first lantern comes from the measured opening policy, not from search.
  if (game.history.length === 0) {
    const j = OPENING.pickOpening(geo);
    plan = []; lastInfo = null; evalInfo = null; live = null;
    return playMove(j, () => setTimeout(nextTurn, 300));   // nextTurn clears busy
  }
  // Swap decision as the second player.
  if (!swapUsed && game.canSwap()) {
    swapUsed = true;
    if (OPENING.shouldSwap(game.history[0].move, geo)) { doSwap(); toast(t('aiSwapped')); return setTimeout(nextTurn, 900); }
    if (cfg.mode === 'ai') toast(t('aiNoSwap'));
  }
  live = null;
  const handle = think(p, lv.ms, lv.depth, (m) => { live = m; noteEval(m); updatePanel(); draw(); });
  currentThink = handle;
  handle.promise.then(res => {
    currentThink = null;
    if (!res) return;                       // position was reset while it was thinking
    let move = res.move;
    if (lv.noise > 0 && res.scores && res.scores.length > 1) {
      // weaker levels: pick among moves near the best with some randomness
      const best = res.scores[0].score; const pool = res.scores.filter(s => s.score >= best - lv.noise);
      move = pool[Math.floor(Math.random() * pool.length)].move;
    }
    lastInfo = { value: res.value, depth: res.depth, nodes: res.nodes, ms: res.ms, side: p };
    noteEval(res);
    plan = (res.pv || []).slice(1, 5);
    live = null;
    playMove(move, () => setTimeout(nextTurn, cfg.mode === 'demo' ? 700 : 150));
  });
}

function doSwap() {
  game.swapOpening();
  swapUsed = true;
  plan = []; lastInfo = null; evalInfo = null; live = null; updatePanel(); draw();
}

// Runs while it is the human's turn. With a worker it is genuinely free; either way every depth
// it completes refines the guess, so whenever the human moves we already have the best one so far.
// Keeps the win chance current when no other search is running (two players on one device, or
// the prediction turned off). It costs nothing: the worker is idle while a human thinks.
function meterEval() {
  if (!game || game.over || busy) return;
  const at = game.history.length;
  const fresh = (m) => { if (game.history.length === at) { noteEval(m); updatePanel(); } };
  think(game.toMove, METER_MS, 64, fresh).promise.then(r => { if (r) fresh(r); });
}

function makePrediction() {
  if (!isHuman(game.toMove) || busy || game.over) return;
  const handle = think(game.toMove, PREDICT_MS, 64, (m) => { if (isHuman(game.toMove) && !busy) { prediction = m.move; noteEval(m); updatePanel(); } });
  currentThink = handle;
  handle.promise.then(res => { if (currentThink === handle) currentThink = null; if (res && isHuman(game.toMove) && !busy) { prediction = res.move; noteEval(res); updatePanel(); } });
}

function humanPlay(j) {
  if (busy || game.over || !isHuman(game.toMove)) return;
  if (game.hands[game.toMove] <= 0) return;
  if (currentThink) { currentThink.cancel(); currentThink = null; }
  selected = -1;
  const p = game.toMove;
  let msg = null;
  if (cfg.mode === 'ai' && prediction !== null && document.getElementById('optPredict').checked) {
    predStats.total++;
    if (prediction === j) { predStats.hit++; msg = t('predRight'); }
    else if (prediction >= 0) { msg = t('predWrong'); revealCell = prediction; setTimeout(() => { revealCell = -1; draw(); }, 1800); }
  }
  prediction = null;
  busy = true;
  playMove(j, () => { updatePanel(msg); if (msg) toast(msg); setTimeout(nextTurn, 250); });   // nextTurn clears busy
}

function showOver() {
  const [a, b] = game.score();
  const dlg = document.getElementById('dlgOver');
  const winnerName = a > b ? (cfg.mode === 'ai' ? nameOf(1) : t('gold')) : (cfg.mode === 'ai' ? nameOf(2) : t('turq'));
  document.getElementById('overTitle').textContent = a === b ? t('draw') : t('winner', winnerName);
  const lines = [t('finalScore', a, b)];
  if (biggestChain >= 2) lines.push(t('biggest', biggestChain));
  if (predStats.total > 0 && cfg.mode === 'ai') lines.push(t('predScore', predStats.hit, predStats.total));
  document.getElementById('overBody').innerHTML = lines.map(l => `<p>${l}</p>`).join('');
  updatePanel();
  if (cfg.mode === 'demo') { demoTimer = setTimeout(() => newGame(), 4000); return; }
  if (!dlg.open) dlg.showModal();
}

// ---------------- input ----------------
function pointerCell(e) { const r = canvas.getBoundingClientRect(); return cellAt((e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr); }
canvas.addEventListener('click', e => {
  if (busy || !game || game.over || !isHuman(game.toMove)) return;
  const j = pointerCell(e); if (j < 0 || game.board[j] !== 0) { selected = -1; draw(); return; }
  if (selected === j) humanPlay(j); else { selected = j; cursor = j; draw(); if (e.pointerType !== 'mouse') toast(t('confirmHint')); }
});
canvas.addEventListener('mousemove', e => {
  if (busy || !game || game.over || !isHuman(game.toMove) || matchMedia('(hover: none)').matches) return;
  const j = pointerCell(e); const s = (j >= 0 && game.board[j] === 0) ? j : -1;
  if (s !== selected) { selected = s; draw(); }
});
canvas.addEventListener('mouseleave', () => { if (selected >= 0 && !matchMedia('(hover: none)').matches) { selected = -1; draw(); } });
canvas.addEventListener('keydown', e => {
  if (!game) return;
  const DIR = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (DIR[e.key]) {
    e.preventDefault(); const c = geo.cells[cursor < 0 ? 0 : cursor]; const q = c.q + DIR[e.key][0], r = c.r + DIR[e.key][1];
    const i = geo.index.get(q + ',' + r); if (i !== undefined) { cursor = i; selected = game.board[i] === 0 && isHuman(game.toMove) ? i : -1; draw(); }
  } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (cursor >= 0 && game.board[cursor] === 0) { if (selected === cursor) humanPlay(cursor); else { selected = cursor; draw(); } } }
});
canvas.addEventListener('focus', () => draw()); canvas.addEventListener('blur', () => draw());

document.getElementById('btnPass').onclick = () => { if (busy || !isHuman(game.toMove)) return; selected = -1; prediction = null; busy = true; playMove(-1, () => { busy = false; setTimeout(nextTurn, 200); }); };
document.getElementById('btnSwap').onclick = () => { if (!isHuman(game.toMove)) return; selected = -1; doSwap(); setTimeout(nextTurn, 300); };
document.getElementById('btnHint').onclick = () => {
  if (busy || !isHuman(game.toMove)) return;
  const btn = document.getElementById('btnHint'); btn.disabled = true;
  // Tie the answer to the position it was asked about. Without this, a hint asked for and then
  // moved past still arrives and pre-selects a cell, and the next tap plays it.
  const askedAt = game.history.length;
  const handle = think(game.toMove, HINT_MS, 64, (m) => { if (game.history.length === askedAt) { live = { ...m, hint: true }; draw(); } });
  currentThink = handle;
  handle.promise.then(res => {
    if (currentThink === handle) currentThink = null;
    live = null; btn.disabled = false;
    if (!res || game.history.length !== askedAt || busy || !isHuman(game.toMove)) return draw();
    if (res.move >= 0) { selected = res.move; cursor = res.move; draw(); toast(t('confirmHint')); }
    else { draw(); toast(t('pass')); }
  });
};
document.getElementById('btnUndo').onclick = () => {
  if (busy || !game.history.length) return;
  selected = -1; plan = []; lastInfo = null; evalInfo = null; prediction = null;
  abortThinking();
  const undoOne = () => { const rec = game.undo(); if (rec && rec.swap) swapUsed = false; return rec; };
  undoOne();
  if (cfg.mode === 'ai') { while (game.history.length && !isHuman(game.toMove)) undoOne(); }
  swapUsed = game.history.some(h => h.swap) || game.history.length > 1;
  // these describe moves that no longer exist
  biggestChain = game.history.reduce((m, h) => Math.max(m, (h.waves || []).reduce((a, w) => a + w.length, 0)), 0);
  predStats = { hit: 0, total: 0 };
  updatePanel(); draw();
  if (!isHuman(game.toMove)) setTimeout(nextTurn, 200);
};
document.getElementById('btnShare').onclick = () => (Online.active() ? Online : LinkGame).share();
document.getElementById('btnLeave').onclick = () => { Online.leave(); newGame({ mode: 'ai', level: 2, human: 1 }); };
document.getElementById('btnRematch').onclick = () => newGame({ mode: 'online' });   // same room, new game
// Leaving is the common case -- closing the tab, locking the phone -- and the point of the room is
// that the other player finds out. Say so on the way out rather than making them wait for the will.
addEventListener('pagehide', () => Online.bye());
addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Online.poke(); });

// ---------------- installing ----------------
// Android and desktop Chrome hand us a real install prompt; iOS has no API at all, so the most
// that can be done there is point at the button Apple hides in the share sheet. Either way the
// offer only appears on a page that can actually be installed -- the single file has no manifest,
// so it never shows there -- and never once the game is already running from the home screen.
const Install = (function () {
  const bar = document.getElementById('installBar');
  const go = document.getElementById('installGo');
  const dlg = document.getElementById('dlgInstall');
  let prompt = null, dismissed = false;

  try { dismissed = localStorage.getItem('fw-install-dismissed') === '1'; } catch (e) {}

  const installable = () => !!document.querySelector('link[rel="manifest"]');
  const alreadyInstalled = () =>
    (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const isApple = () => /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);   // iPadOS reports as a Mac

  function refresh() {
    const show = !dismissed && !alreadyInstalled() && installable() && (prompt || isApple());
    bar.classList.toggle('show', show);
    if (!show) return;
    document.getElementById('installText').textContent = t('installOffer');
    go.textContent = prompt ? t('installNow') : t('installHow');
  }

  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); prompt = e; refresh(); });
  addEventListener('appinstalled', () => { prompt = null; dismissed = true; refresh(); });

  go.onclick = async () => {
    if (prompt) {
      const p = prompt; prompt = null;
      p.prompt();
      try { await p.userChoice; } catch (e) {}
      refresh();
      return;
    }
    document.getElementById('installBody').innerHTML = t('installIos');
    dlg.showModal();
  };
  document.getElementById('installNo').onclick = () => {
    dismissed = true;
    try { localStorage.setItem('fw-install-dismissed', '1'); } catch (e) {}
    refresh();
  };

  return { refresh, get shown() { return bar.classList.contains('show'); },
           get canPromptNow() { return !!prompt; } };
})();

// ---------------- play a friend by link ----------------
// The whole game is in the URL: one byte a move, 0-90 a cell, 91 a pass, 92 taking the opening
// lantern, base64url in the hash. Opening a link replays it through the engine rather than trusting
// it -- anything the rules refuse makes the link invalid and we start fresh.
const LinkGame = (function () {
  const PASS = 91, SWAP = 92, MAX = 200;
  const enc = (bytes) => {
    let s = '';
    for (const b of bytes) s += String.fromCharCode(b);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  };
  const dec = (str) => {
    const t2 = str.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(t2 + '==='.slice((t2.length + 3) % 4));
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  };

  function encode(g) {
    const bytes = new Uint8Array(g.history.length);
    g.history.forEach((rec, i) => { bytes[i] = rec.swap ? SWAP : rec.move < 0 ? PASS : rec.move; });
    return enc(bytes);
  }

  // Returns a Game, or null if any byte is not a legal move in the position it arrives at.
  function replay(codeStr) {
    let bytes;
    try { bytes = dec(codeStr); } catch (e) { return null; }
    if (!bytes.length || bytes.length > MAX) return null;
    const g = new F.Game(RADIUS, RULES);
    for (const b of bytes) {
      if (g.over) return null;
      if (b === SWAP) { if (!g.swapOpening()) return null; continue; }
      if (b === PASS) { g.play(-1); continue; }
      if (b >= g.geo.N || g.board[b] !== 0) return null;
      if (!g.play(b)) return null;                       // no lantern left in hand
    }
    return g;
  }

  const codeInHash = () =>
    (location.search.match(/[?&]g=([A-Za-z0-9\-_]+)/) || [])[1] ||
    (location.hash.match(/^#g=([A-Za-z0-9\-_]+)$/) || [])[1] || null;   // '#g=' kept for old links

  function writeHash(g) {
    if (!g.history.length) return;              // nothing played yet: no link to write
    const url = location.pathname + '?g=' + encode(g);
    if (location.pathname + location.search !== url) history.replaceState(null, '', url);
  }

  async function share() {
    const url = location.href;
    if (navigator.share) {
      try { await navigator.share({ title: t('title'), text: t('shareText'), url }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(url); toast(t('shareCopied')); }
    catch (e) { window.prompt(t('shareBtn'), url); }
  }

  return {
    encode, replay, codeInHash, writeHash, share,
    // shown for a game two people share; the machine's games have nothing to pass back and forth
    active: () => cfg.mode === 'pvp',
  };
})();

// ---------------- two devices, one game ----------------
// Sharing is a room, not a position. Both phones meet on a public relay (see relay.js), so each
// one sees the other arrive, sees their moves as they happen, and sees them go. Nothing is stored
// anywhere: the room is a random name, and the only thing published into it is the move list.
const Online = (function () {
  const RELAY = window.FawaneesRelay;
  const HOST_WAIT = 11000;                 // a broker that has not answered by now is not going to
  let link = null, room = null, seat = null;
  let status = 'off', peer = false, everPeer = false, hostTry = 0, hostTimer = null, swapped = false;

  const active = () => !!link;
  const colour = () => (seat === 'a' ? 1 : 2);
  // Not origin + pathname: a page opened straight from disk has no origin, and the single-file
  // copy is a real way people run this.
  const urlFor = (r) => location.href.replace(/[?#].*$/, '') + '?r=' + r;

  // Reloading must put you back in your own chair; opening the same link in a second tab must
  // not. That is exactly sessionStorage: it survives a refresh and belongs to one tab only.
  // localStorage would hand the host's chair to anyone opening the link on the same browser.
  const seatKey = (r) => 'fw-seat-' + r;
  const rememberSeat = (r, s) => { try { sessionStorage.setItem(seatKey(r), s); } catch (e) {} };
  const seatFor = (r) => { try { return sessionStorage.getItem(seatKey(r)); } catch (e) { return null; } };

  function stop() {
    clearTimeout(hostTimer); hostTimer = null;
    if (link) link.leave();
    link = null; room = null; seat = null;
    status = 'off'; peer = false; everPeer = false;
  }

  function connect(r, s) {
    stop();                                // clears room/seat, so callers pass them in
    room = r; seat = s; status = 'connecting';
    rememberSeat(r, s);
    history.replaceState(null, '', location.pathname + '?r=' + r);
    link = RELAY.join({
      room: r, seat: s,
      onStatus: (st) => { status = st; repaint(); },
      onPeer: (on) => {
        peer = on;
        if (on) everPeer = true;
        toast(t(on ? 'roomPeerJoined' : 'roomPeerLeft'));
        if (on && game) nextTurn(); else repaint();     // their arrival is what starts the turn
      },
      onState: adopt,
      onSeatTaken: () => {
        // Someone else is in this chair. If the other one is empty this is almost always the host
        // coming back through their own link after closing the tab, so go and sit there instead
        // of two people sharing a colour. Once only, or a pair of clients could trade places
        // forever.
        if (!swapped && !peer) { swapped = true; return connect(room, seat === 'a' ? 'b' : 'a'); }
        toast(t('roomTaken'));
      },
    });
  }

  // The host picks the broker, and the room name records which one, so the link always lands both
  // players in the same place. If the first broker will not answer we start over on the next --
  // safe only because the link has not been shared yet, which is why the share button waits.
  function host() {
    hostTry = 0; swapped = false;
    tryHost();
  }
  function tryHost() {
    connect(RELAY.newRoomId(hostTry % RELAY.BROKERS.length), 'a');
    status = 'prep';
    hostTimer = setTimeout(() => {
      if (!link || status === 'online') return;
      if (++hostTry >= RELAY.BROKERS.length) { toast(t('roomNoConnect')); return; }
      tryHost();
    }, HOST_WAIT);
    repaint();
  }

  // Whoever opens a link they have not been in before takes the second chair; if they have been
  // in this room, they get their own chair back.
  const join = (r) => { swapped = false; connect(r, seatFor(r) || 'b'); };

  // Whatever arrives from the other device is replayed through the engine, never trusted.
  function adopt(code) {
    const g = code ? LinkGame.replay(code) : new F.Game(RADIUS, RULES);
    if (!g) return;                        // not a game we can reach legally: keep what we have
    // Only a new game makes a game shorter. Anything else that arrives behind us is the broker
    // handing back what it kept while we were offline -- and we moved since. Answer with ours.
    if (code && game && g.history.length < game.history.length) return sync(game);
    abortThinking();
    const over = document.getElementById('dlgOver');
    if (over.open) over.close();           // they started another game; stop showing the last one
    game = g; geo = game.geo;
    selected = -1; busy = false; prediction = null; plan = []; lastInfo = null; evalInfo = null;
    swapUsed = !game.canSwap();
    openingCell = game.history.length && game.history[0].move >= 0 ? game.history[0].move : -1;
    resize();
    nextTurn();
  }

  function sync(g) {
    if (!link) return;
    const code = g.history.length ? LinkGame.encode(g) : '';
    if (code !== link.state) link.publish(code);
  }

  function repaint() { if (game) { updatePanel(); draw(); } }

  function render() {
    document.getElementById('linkBar').hidden = false;
    const row = document.getElementById('peerRow');
    const waiting = status !== 'online' || !peer;
    row.hidden = false;
    row.className = 'peer ' + (status !== 'online' ? 'waiting' : peer ? 'here' : everPeer ? 'gone' : 'waiting');
    // Short here on purpose: the status card above already spells out what is going on, and the
    // same sentence in two places one under the other reads like a stutter.
    document.getElementById('peerText').textContent =
      status === 'prep' ? t('dotPrep')
      : status !== 'online' ? t('dotConnecting')
      : peer ? t('dotHere')
      : everPeer ? t('dotAway') : t('dotNotYet');
    const codeEl = document.getElementById('roomCode');
    codeEl.hidden = !waiting || !room;
    codeEl.textContent = room ? room.slice(1).toUpperCase() : '';
    document.getElementById('linkTurn').hidden = true;   // whose turn it is belongs to the status card
    // A rematch should not need another link: the room outlives the game in it.
    const again = document.getElementById('btnRematch');
    again.hidden = !game.over;
    again.textContent = t('rematch');
    const share = document.getElementById('btnShare');
    share.disabled = status !== 'online';   // a link to a room we never reached helps nobody
    document.getElementById('btnShareText').textContent = t(peer ? 'shareBtn' : 'roomShare');
    const leave = document.getElementById('btnLeave');
    leave.hidden = false;
    leave.textContent = t('leaveRoom');
  }

  async function share() {
    const url = urlFor(room);
    if (navigator.share) {
      try { await navigator.share({ title: t('title'), text: t('shareText'), url }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(url); toast(t('shareCopied')); }
    catch (e) { window.prompt(t('roomShare'), url); }
  }

  return {
    host, join, sync, render, share, active, colour,
    roomInUrl: () => (location.search.match(/[?&]r=([A-Za-z0-9]+)/) || [])[1] || null,
    leave() {
      if (!link) return;
      stop();
      history.replaceState(null, '', location.pathname);
      toast(t('roomLeft'));
    },
    bye() { if (link) link.leave(); },     // the page is going away; just tell the other side
    poke() { if (link) link.poke(); },     // back from the background: reconnect now, not in a minute
    get peerHere() { return peer; },
    get everHere() { return everPeer; },
    get status() { return status; },
    get room() { return room; },
    get seat() { return seat; },
  };
})();
